<!DOCTYPE html>
<html lang="tr">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<meta name="theme-color" content="#020202">

<title>Dilerim Ki</title>

<style>

/* =====================================================
   TEMEL AYARLAR
   ===================================================== */

:root{
  --arka-plan:#020202;
  --yazi:#f1efe9;
  --soluk:#666;
  --cizgi:rgba(255,255,255,.12);
  --yumusak:rgba(255,255,255,.05);
  --gecis:cubic-bezier(.22,.61,.36,1);
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,
body{
  width:100%;
  height:100%;

  overflow:hidden;

  background:#000;
  color:var(--yazi);

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  -webkit-tap-highlight-color:transparent;

  user-select:none;
  -webkit-user-select:none;

  -webkit-touch-callout:none;

  overscroll-behavior:none;
}

body{
  position:fixed;
  inset:0;
}

img{
  display:block;

  user-select:none;
  -webkit-user-drag:none;
}


/* =====================================================
   ANA UYGULAMA ALANI
   ===================================================== */

#uygulama{
  position:fixed;

  inset:0;

  overflow:hidden;

  background:#000;
}


/* =====================================================
   FİLM GRAIN / FİLM TANESİ
   ===================================================== */

.tanecik{
  position:fixed;

  inset:-50%;

  z-index:90;

  pointer-events:none;

  opacity:.045;

  background-image:url(
    "data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='gurultu'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23gurultu)' opacity='.8'/%3E%3C/svg%3E"
  );

  animation:
    tanecikHareketi
    .22s
    steps(2)
    infinite;
}

@keyframes tanecikHareketi{

  0%{
    transform:translate(0,0);
  }

  25%{
    transform:translate(2%,-1%);
  }

  50%{
    transform:translate(-1%,2%);
  }

  75%{
    transform:translate(1%,1%);
  }

  100%{
    transform:translate(-2%,-1%);
  }

}


/* =====================================================
   SAHNE SİSTEMİ
   ===================================================== */

.sahne{

  position:absolute;

  inset:0;

  display:flex;

  align-items:center;
  justify-content:center;

  opacity:0;

  visibility:hidden;

  pointer-events:none;

  transform:scale(1.025);

  transition:
    opacity .9s var(--gecis),
    transform 1.15s var(--gecis),
    visibility 0s linear .9s;
}

.sahne.aktif{

  opacity:1;

  visibility:visible;

  pointer-events:auto;

  transform:scale(1);

  transition-delay:0s;
}

.sahne.gidiyor{

  opacity:0;

  transform:scale(.985);
}


/* =====================================================
   SİNEMATİK GEÇİŞ
   ===================================================== */

#sinematikGecis{

  position:fixed;

  inset:0;

  z-index:100;

  background:#000;

  pointer-events:none;

  opacity:0;

  transform:scaleY(0);

  transform-origin:center;
}

#sinematikGecis.oyna{

  animation:
    sinematikPerde
    .85s
    var(--gecis)
    forwards;
}

@keyframes sinematikPerde{

  0%{
    opacity:0;
    transform:scaleY(0);
  }

  30%{
    opacity:1;
    transform:scaleY(1);
  }

  70%{
    opacity:1;
    transform:scaleY(1);
  }

  100%{
    opacity:0;
    transform:scaleY(0);
  }

}


/* =====================================================
   SAHNE NUMARASI
   ===================================================== */

#sahneSayaci{

  position:fixed;

  top:24px;
  right:25px;

  z-index:110;

  font:
    9px/1
    monospace;

  letter-spacing:3px;

  color:rgba(255,255,255,.35);
}

#mevcutSahne{

  color:rgba(255,255,255,.85);

  font-weight:400;
}


/* =====================================================
   ALT İLERLEME ÇİZGİSİ
   ===================================================== */

#ilerleme{

  position:fixed;

  left:0;
  bottom:0;

  width:0;
  height:1px;

  z-index:110;

  background:rgba(255,255,255,.75);

  transition:
    width .65s var(--gecis);
}


/* =====================================================
   DEVAM ET YAZISI
   ===================================================== */

#dokun{

  position:fixed;

  left:50%;
  bottom:30px;

  transform:translateX(-50%);

  z-index:110;

  font:
    8px/1
    monospace;

  letter-spacing:4px;

  color:rgba(255,255,255,.25);

  transition:opacity .5s ease;
}

#dokun.gizli{
  opacity:10;
}

/* ... existing styles kept as-is ... */
</style>

</head>

<body>

<audio id="arkaPlanMuzigi" loop preload="auto">
  <source src="dolu-kadehi-ters-tut-dilerim-ki.mp3" type="audio/mpeg">
</audio>

<div id="uygulama">
  <!-- mevcut içerik burada kalır -->
</div>

<script>
/* mevcut script burada kalır */

const arkaPlanMuzigi = document.getElementById("arkaPlanMuzigi");

function muzigiBaslat() {
    arkaPlanMuzigi.volume = 0.35;

    arkaPlanMuzigi.play().catch((hata) => {
        console.log("Müzik başlatılamadı:", hata);
    });
}

document.addEventListener("pointerdown", muzigiBaslat, { once: true });
</script>

</body>
</html>
